<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inkuru | The Flash News 250</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f1f5f9;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    .container {
      width: 92%;
      max-width: 850px;
      margin: 30px auto;
    }

    .article {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .article img {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      display: block;
    }

    .article-content {
      padding: 30px;
    }

    .category {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 14px;
      margin-bottom: 15px;
    }

    h2 {
      font-size: 34px;
      line-height: 1.2;
      margin-bottom: 15px;
    }

    .date {
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .content {
      font-size: 18px;
      line-height: 1.8;
      white-space: pre-line;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    #loading,
    #error {
      text-align: center;
      padding: 40px;
    }

    #error {
      color: red;
    }
  </style>
</head>

<body>

<header>
  <h1>The Flash News 250</h1>
</header>

<div class="container">

  <a href="index.html" class="back">
    ← Subira ku makuru
  </a>

  <div id="loading">
    Inkuru irimo gufunguka...
  </div>

  <div id="error"></div>

  <article class="article" id="article" style="display:none;">

    <img id="articleImage" src="" alt="">

    <div class="article-content">

      <span class="category" id="articleCategory"></span>

      <h2 id="articleTitle"></h2>

      <div class="date" id="articleDate"></div>

      <div class="content" id="articleContent"></div>

    </div>

  </article>

</div>

<script>

const SUPABASE_URL =
"https://ozlxkleiagayfrnqvvld.supabase.co";

const SUPABASE_KEY =
"sb_publishable_iEqsbTByRdSI9dTi5IDujw_sZZfJtPb";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// GET ID FROM URL
const params =
new URLSearchParams(window.location.search);

const newsId =
params.get("id");


// LOAD ARTICLE
async function loadArticle() {

  const loading =
    document.getElementById("loading");

  const errorBox =
    document.getElementById("error");

  if (!newsId) {

    loading.style.display = "none";

    errorBox.textContent =
      "Nta nkuru yasabwe.";

    return;
  }


  const { data, error } =
    await supabaseClient
      .from("news")
      .select("*")
      .eq("id", newsId)
      .single();


  loading.style.display = "none";


  if (error) {

    errorBox.textContent =
      "Error: " + error.message;

    return;
  }


  document.getElementById("articleImage").src =
    data.image_url;

  document.getElementById("articleImage").alt =
    data.title;

  document.getElementById("articleCategory").textContent =
    data.category;

  document.getElementById("articleTitle").textContent =
    data.title;

  document.getElementById("articleContent").textContent =
    data.content;

  document.getElementById("articleDate").textContent =
    new Date(data.created_at).toLocaleString();

  document.getElementById("article").style.display =
    "block";
}


loadArticle();

</script>

</body>
</html>
