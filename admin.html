<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin | The Flash News 250</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    #logoutBtn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .card {
      background: white;
      margin-top: 20px;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    label {
      font-weight: bold;
      color: #374151;
    }

    #publishBtn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>The Flash News 250 - Admin</h1>
    <button id="logoutBtn">Logout</button>
  </header>

  <div class="card">

    <h2>Shyiramo Amakuru Mashya</h2>

    <label for="title">Umutwe w'Amakuru</label>
    <input
      type="text"
      id="title"
      placeholder="Andika umutwe w'amakuru"
    >

    <label for="content">Amakuru</label>
    <textarea
      id="content"
      placeholder="Andika inkuru hano..."
    ></textarea>

    <button id="publishBtn">Publish News</button>

    <p id="message"></p>

  </div>

</div>

<script>

  const SUPABASE_URL =
    "https://ozlxkleiagayfrnqvvld.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_iEqsbTByRdSI9dTi5IDujw_sZZfJtPb";

  const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


  // Kureba niba user yinjiye
  async function checkUser() {

    const { data: { user } } =
      await supabaseClient.auth.getUser();

    if (!user) {
      window.location.href = "login.html";
    }
  }

  checkUser();


  // Logout
  document
    .getElementById("logoutBtn")
    .addEventListener("click", async function() {

      await supabaseClient.auth.signOut();

      window.location.href = "login.html";

    });


  // Publish News
  document
    .getElementById("publishBtn")
    .addEventListener("click", async function() {

      const title =
        document.getElementById("title").value.trim();

      const content =
        document.getElementById("content").value.trim();

      const message =
        document.getElementById("message");


      if (!title || !content) {

        message.style.color = "red";
        message.textContent =
          "Uzuza umutwe n'amakuru mbere yo gutangaza.";

        return;
      }


      message.style.color = "#2563eb";
      message.textContent = "Birimo gutangazwa...";


      const { error } =
        await supabaseClient
          .from("news")
          .insert([
            {
              title: title,
              content: content
            }
          ]);


      if (error) {

        message.style.color = "red";
        message.textContent =
          "Habaye ikibazo: " + error.message;

        return;
      }


      message.style.color = "green";
      message.textContent =
        "Amakuru yatangajwe neza!";


      document.getElementById("title").value = "";
      document.getElementById("content").value = "";

    });

</script>

</body>
</html>
