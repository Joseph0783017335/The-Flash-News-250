<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Flash News 250</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f1f5f9;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      color: #cbd5e1;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 30px auto;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .news-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .news-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
    }

    .news-content {
      padding: 18px;
    }

    .category {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .news-content h2 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    .news-content p {
      color: #475569;
      line-height: 1.6;
    }

    .date {
      margin-top: 12px;
      color: #94a3b8;
      font-size: 13px;
    }

    #loading,
    #error,
    #noNews {
      text-align: center;
      padding: 40px;
      font-weight: bold;
    }

    #error {
      color: red;
    }
  </style>
</head>

<body>

<header>
  <h1>The Flash News 250</h1>
  <p>Amakuru agezweho mu Rwanda no ku isi</p>
</header>

<div class="container">

  <div id="loading">
    Amakuru arimo gutegurwa...
  </div>

  <div id="error"></div>

  <div id="noNews"></div>

  <div class="news-grid" id="newsContainer"></div>

</div>

<script>

const SUPABASE_URL =
"https://ozlxkleiagayfrnqvvld.supabase.co";

const SUPABASE_KEY =
"sb_publishable_iEqsbTByRdSI9dTi5IDujw_sZZfJtPb";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// GET NEWS
async function loadNews() {

  const loading =
    document.getElementById("loading");

  const errorBox =
    document.getElementById("error");

  const noNews =
    document.getElementById("noNews");

  const container =
    document.getElementById("newsContainer");


  const { data, error } =
    await supabaseClient
      .from("news")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  loading.style.display = "none";


  if (error) {

    errorBox.textContent =
      "Error: " + error.message;

    return;
  }


  if (!data || data.length === 0) {

    noNews.textContent =
      "Nta makuru arashyirwa hano.";

    return;
  }


  data.forEach(function(news) {

    const card =
      document.createElement("div");

    card.className = "news-card";


    card.innerHTML = `

      <img
        src="${news.image_url}"
        alt="${news.title}"
      >

      <div class="news-content">

        <span class="category">
          ${news.category}
        </span>

        <h2>
          ${news.title}
        </h2>

        <p>
          ${news.content}
        </p>

        <div class="date">
          ${new Date(news.created_at).toLocaleString()}
        </div>

      </div>

    `;


    container.appendChild(card);

  });

}


loadNews();

</script>

</body>
</html>
