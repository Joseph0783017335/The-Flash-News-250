<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Flash News 250</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .article {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .article img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 8px;
        }

        .article h2 {
            font-size: 32px;
            margin-top: 20px;
        }

        .article p {
            font-size: 18px;
            line-height: 1.7;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #111827;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>The Flash News 250</h1>
</header>

<div class="container">

    <a href="index.html" class="back">← Subira ku makuru</a>

    <article class="article">

        <img id="article-image" src="" alt="News Image">

        <h2 id="article-title">Loading...</h2>

        <p id="article-content">
            Tegereza gato...
        </p>

    </article>

</div>

<script>
    const params = new URLSearchParams(window.location.search);

    const title = params.get("title");
    const content = params.get("content");
    const image = params.get("image");

    if (title) {
        document.getElementById("article-title").textContent = title;
    }

    if (content) {
        document.getElementById("article-content").textContent = content;
    }

    if (image) {
        document.getElementById("article-image").src = image;
    }
</script>

</body>
</html>
