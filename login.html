<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | The Flash News 250</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>The Flash News 250</h1>

    <p class="subtitle">Admin Login</p>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">Login</button>

    </form>

    <p id="message"></p>

  </div>

  <script>

    const SUPABASE_URL ="https://ozlxkleiagayfrnqvvld.supabase.co";

    const SUPABASE_KEY =  "sb_publishable_iEqsbTByRdSI9dTi5IDujw_sZZfJtPb";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      message.textContent = "Logging in...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        message.style.color = "red";
        message.textContent = error.message;

        return;
      }

      message.style.color = "green";
      message.textContent = "Login successful!";

      window.location.href = "admin.html";

    });

  </script>

</body>
</html>
